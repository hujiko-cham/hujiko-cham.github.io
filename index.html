<!doctype html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="Content-Style-Type" content="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム・ふじこのほめぱげ</title>
    <link rel="icon" type="image/png" href="/images/others/favicon.png">
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
    <div class="container">
        <br><br><img src="/images/others/logo.png" id="logo"><br><br>
        <marquee scrollamount="10">
            <span class="rainbow">NEW!!</span>
            新しいミニゲーム「ハンバーガー屋（デモ版）」が追加されたよ<img src="/images/icons/icon_exclamation.gif">
        </marquee>
        <h2>ようこそ！<span class="english">Welcome</span></h2>
        <p>
            ふじこのホームページです<img src="/images/icons/icon_exclamation.gif"><br><br>
            HTMLとかの練習です<img src="/images/icons/icon_ie.gif" class="icon_s"><br><br>
            楽しんでね(＊´▽`＊)=3♪<br><br>
        </p>
        <h2>コンテンツ<span class="english">Contents</span></h2>
        <h3><a href="/pages/about.html"><img src="/images/icons/icon_star1.gif">わたしまとめ</a></h3>
        <p>
            ふじこのまとめページです<img src="/images/icons/icon_book.gif" class="icon_b"><br><br>
        </p>
        <h3><a href="/pages/diary/diary_list.html"><img src="/images/icons/icon_star2.gif">日記</a></h3>
        <p>
            ふじこの日記です<img src="/images/icons/icon_writing.gif" class="icon_s"><br><br>
        </p>
        <h3><a href="/pages/game/game_list.html"><img src="/images/icons/icon_star3.gif">ミニゲーム</a>
        <img src="/images/icons/icon_new.gif"></h3>
        <p>
            ふじこのミニゲームです<img src="/images/icons/icon_game.gif" class="icon_s"><br><br>
        </p>
        <h2>テーマ設定<span class="english">Theme&nbsp;Settings</span></h2>
        <p>
            背景と色を変更できます。<br><br>
            背景は4種類。色は1677万7216色。<br><br>
            合わせて6710万8864通り<img src="/images/icons/icon_exclamation.gif"><br><br>
            世界にひとつのほめぱげを作ろう<img src="/images/icons/icon_exclamation.gif"><br>
        </p>
        <div class="theme_switcher">
            <p><span class="bold">背景の設定</span></p>
            <button id="sky_button">空</button>
            <button id="leopard_button">レオパード</button>
            <button id="greenwall_button">緑壁</button>
            <button id="bricks_button">レンガ</button>
            <p><span class="bold">色の設定</span></p>
            <button id="pink_button">赤</button>
            <button id="green_button">緑</button>
            <button id="blue_button">青</button>
            <button id="yellow_button">黄</button><br>
            <span style="width: 120px;">カラーピッカー</span>
            <input type="color" id="color_picker" value="lightpink"><br>
            <button id="reset_button">デフォルト</button>
            <button id="apply_button">適用</button>
        </div>
    </div>
    <script src="/script.js"></script>
</body>
</html>
